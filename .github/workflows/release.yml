name: CD - Despliegue de APK a Supabase

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build_and_deploy_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Build Web (Angular)
        run: npm run build:raw

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Firmar APK
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          echo "Tamaño del archivo keystore decodificado: $(wc -c < release.keystore) bytes"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Usando Android Build Tools desde: $BUILD_TOOLS_DIR"
          
          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK_RAW"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_RAW" android/app/build/outputs/apk/release/app-aligned.apk || cp "$APK_RAW" android/app/build/outputs/apk/release/app-aligned.apk
          
          echo "Intentando firmar APK con apksigner (detección automática)..."
          if $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/app-signed.apk \
            android/app/build/outputs/apk/release/app-aligned.apk; then
            echo "✅ Firmado exitoso."
          else
            echo "Intentando firmar especificando --ks-type JKS..."
            if $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-type JKS \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-signed.apk \
              android/app/build/outputs/apk/release/app-aligned.apk; then
              echo "✅ Firmado exitoso con JKS."
            else
              echo "Intentando firmar especificando --ks-type PKCS12..."
              $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-type PKCS12 \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out android/app/build/outputs/apk/release/app-signed.apk \
                android/app/build/outputs/apk/release/app-aligned.apk
              echo "✅ Firmado exitoso con PKCS12."
            fi
          fi
            
          echo "signedReleaseFile=android/app/build/outputs/apk/release/app-signed.apk" >> $GITHUB_OUTPUT

      - name: Instalar cliente Supabase JS (para script)
        run: npm install @supabase/supabase-js --no-save

      - name: Publicar Actualización en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_PATH: ${{steps.sign_app.outputs.signedReleaseFile}}
          VERSION_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: node scripts/publish-update.js
